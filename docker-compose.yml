services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: readback
      POSTGRES_PASSWORD: readback
      POSTGRES_DB: readback
    ports:
      - "5433:5432"
    volumes:
      - readback_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readback"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  readback_pgdata:
